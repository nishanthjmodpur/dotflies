general {
    disable_loading_bar = false
    hide_cursor = true
	grace = 2
}

background {
    monitor =
    path = ~/Pictures/windows_bsod.png
    color = rgba(25,25,25,1.0)

	# Smooth appearance
    blur_passes = 1
    blur_size = 1

    brightness = 0.90
    contrast = 1.1
    vibrancy = 0.15
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255,255,255,1.0)
    font_size = 72
    font_family = Sans
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(220,220,220,1.0)
    font_size = 20
    font_family = Sans
    position = 0, 70
    halign = center
    valign = center
}

# User label
label {
    monitor =
    text = $USER
    color = rgba(200,200,200,1.0)
    font_size = 18
    font_family = Sans
    position = 0, -90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 3

    rounding = 12

    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true

    outer_color = rgba(80,80,80,0.9)
    inner_color = rgba(20,20,20,0.95)
    font_color = rgba(255,255,255,1.0)

    fade_on_empty = true

    check_color = rgba(204,136,34,1.0)
    placeholder_text = <i>Password...</i>

    hide_input = false

    position = 0, -160
    halign = center
    valign = center
}

animations {
    enabled = yes

    bezier = smooth,0.25,0.1,0.25,1.0

    animation = windows,1,7,smooth
    animation = fade,1,7,smooth
    animation = workspaces,1,6,smooth
}
